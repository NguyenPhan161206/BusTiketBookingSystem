# Chạy toàn bộ hệ thống:            docker compose up --build
# Chỉ chạy DB + Mailpit (dev local): docker compose up -d db mailpit   rồi   npm run dev
services:
  app:
    build: .
    environment:
      # ${VAR:-mặc định}: Compose lấy VAR từ file .env ở thư mục gốc nếu có
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-docker-demo-secret-change-me}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bus_ticket}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-bus_ticket}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${DB_PORT_HOST:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
